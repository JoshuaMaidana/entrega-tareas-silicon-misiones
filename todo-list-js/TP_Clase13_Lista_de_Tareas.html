<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas — TP Clase 13 (DOM)</title>
  <style>
    /* ===== Estilos base (ya hechos, no hace falta que los toques) ===== */
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #F1F2F2;
      color: #20203A;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .app {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(43, 41, 109, 0.12);
      padding: 26px;
    }
    h1 { color: #2B296D; font-size: 22px; margin: 0 0 4px; }
    .sub { color: #6E6E80; font-size: 13px; margin: 0 0 20px; }
    .fila { display: flex; gap: 8px; margin-bottom: 16px; }
    #nuevaTarea {
      flex: 1;
      padding: 11px 12px;
      border: 1.5px solid #CFD0DA;
      border-radius: 8px;
      font-size: 15px;
    }
    #nuevaTarea:focus { outline: none; border-color: #0E6689; }
    #agregar {
      background: #0E6689;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #agregar:hover { background: #0b4f68; }
    #lista { list-style: none; padding: 0; margin: 0; }
    #lista li {
      background: #F7F7FA;
      border: 1px solid #E7E7EE;
      border-radius: 8px;
      padding: 11px 12px;
      margin-bottom: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    /* Clase para tachar una tarea hecha. La activás desde el JS con classList */
    #lista li.hecha {
      text-decoration: line-through;
      color: #9A9AAB;
      background: #EFEFF3;
    }
    #contador { color: #2B296D; font-weight: 600; font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Mi Lista de Tareas</h1>
    <p class="sub">TP Clase 13 · El DOM</p>

    <!-- input + botón para agregar -->
    <div class="fila">
      <input id="nuevaTarea" type="text" placeholder="Escribí una tarea..." />
      <button id="agregar">Agregar</button>
    </div>

    <!-- acá se van a ir agregando las tareas (las crea el JS) -->
    <ul id="lista"></ul>

    <!-- contador de tareas -->
    <p id="contador">Tareas: 0</p>
  </div>

  <script>
    // ============================================================
    // TP CLASE 13 — LISTA DE TAREAS
    // DOM + Eventos + Creación de elementos
    // ============================================================


    // ============================================================
    // 1) SELECCIONAR ELEMENTOS
    // ============================================================

    let input = document.querySelector("#nuevaTarea");
    let boton = document.querySelector("#agregar");
    let lista = document.querySelector("#lista");
    let contador = document.querySelector("#contador");


    // ============================================================
    // 2) ACTUALIZAR CONTADOR
    // ============================================================

    function actualizarContador() {

      let pendientes = lista.querySelectorAll("li:not(.hecha)").length;

      contador.textContent = "Tareas pendientes: " + pendientes;
    }


    // ============================================================
    // 3) AGREGAR UNA TAREA
    // ============================================================

    boton.addEventListener("click", function () {

      let texto = input.value.trim();


      // No permitir tareas vacías

      if (texto === "") {
        return;
      }


      // Crear el elemento <li>

      let li = document.createElement("li");


      // Agregar el texto de la tarea

      li.textContent = texto;


      // ==========================================================
      // BOTÓN PARA ELIMINAR
      // ==========================================================

      let botonEliminar = document.createElement("button");

      botonEliminar.textContent = "Eliminar";


      botonEliminar.addEventListener("click", function (e) {

        e.stopPropagation();

        li.remove();

        actualizarContador();
      });


      li.appendChild(botonEliminar);


      // ==========================================================
      // MARCAR / DESMARCAR COMO HECHA
      // ==========================================================

      li.addEventListener("click", function () {

        li.classList.toggle("hecha");

        actualizarContador();
      });


      // Agregar la tarea a la lista

      lista.appendChild(li);


      // Limpiar el input

      input.value = "";


      // Actualizar el contador

      actualizarContador();
    });


    // ============================================================
    // 4) AGREGAR CON ENTER
    // ============================================================

    input.addEventListener("keydown", function (e) {

      if (e.key === "Enter") {

        boton.click();
      }
    });


    // ============================================================
    // 5) CONTADOR INICIAL
    // ============================================================

    actualizarContador();

  </script>
</body>
</html>
